<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ham and Liz Gaming BRB Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            overflow: hidden; 
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <!-- Standard HTML5 Video Player (Bypasses Twitch's forced mute) -->
    <video id="videoplayer" autoplay></video>

    <script>
        async function loadTwitchClip() {
            // Grab the clipId that our Streamer.bot C# script sends
            const params = new URLSearchParams(window.location.search);
            const clipId = params.get('clipId');
            
            if (!clipId) return;

            try {
                // 1. Ask Twitch's GQL Server for permission to view the raw MP4
                const response = await fetch("https://gql.twitch.tv/gql", {
                    method: 'POST',
                    headers: {
                        'Client-ID': 'kimne78kx3ncx6brgo4mv6wki5h1ko',
                        'Content-Type': 'text/plain;charset=UTF-8'
                    },
                    body: JSON.stringify({
                        operationName: "VideoAccessToken_Clip",
                        variables: { 
                            platform: "web", 
                            slug: clipId 
                        },
                        extensions: {
                            persistedQuery: {
                                version: 1,
                                sha256Hash: "6fd3af2b22989506269b9ac02dd87eb4a6688392d67d94e41a6886f1e9f5c00f"
                            }
                        }
                    })
                });

                const data = await response.json();
                const clipData = data.data.clip;
                
                // 2. Extract the video link and the security tokens
                const sourceUrl = clipData.videoQualities[0].sourceURL;
                const sig = clipData.playbackAccessToken.signature;
                const token = clipData.playbackAccessToken.value;
                
                // 3. Assemble the final, unlocked MP4 URL
                const finalMp4Url = `${sourceUrl}?sig=${sig}&token=${encodeURIComponent(token)}`;
                
                // 4. Push it directly to the video player
                const videoPlayer = document.getElementById('videoplayer');
                videoPlayer.src = finalMp4Url;
                videoPlayer.play();

            } catch (error) {
                console.error("Error fetching Twitch Clip:", error);
            }
        }
        
        loadTwitchClip();
    </script>
</body>
</html>
