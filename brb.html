<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ham and Liz Gaming BRB Player (Raw MP4)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            overflow: hidden; 
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const mp4Url = params.get('mp4');
        
        if (mp4Url) {
            // Build a native HTML5 video player instead of a Twitch iframe
            const video = document.createElement('video');
            video.src = mp4Url;
            video.autoplay = true;
            
            // Notice there is absolutely no 'muted' attribute here
            document.body.appendChild(video);
        }
    </script>
</body>
</html>
